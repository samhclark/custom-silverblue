name: Build bootc image
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '48 3 * * *'  # 3am-ish UTC everyday 
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.17"

jobs:
  lint:
    name: Lint and test Python
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"

      - name: Check
        run: make check

      - name: Test
        run: make test

  build-custom-silverblue:
    name: Build image
    uses: ./.github/workflows/reusable-build.yaml
    permissions:
      contents: read
    with:
      containerfile_path: ./Containerfile
      registry: ghcr.io
      namespace: samhclark
      image_name: custom-silverblue
      tags: |
        45
      publish: false
