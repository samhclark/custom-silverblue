on:
  workflow_call:
    inputs:
      containerfile_path:
        required: true
        type: string
      registry:
        required: true
        type: string
      namespace:
        required: true
        type: string
      image_name:
        required: true
        type: string
      cache_ref:
        required: true
        type: string
      tags:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    secrets:
      cosign_password:
        required: false
      cosign_private_key:
        required: false


jobs:
  build-custom-silverblue:
    name: Build
    if: ${{ ! inputs.publish }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify base image signature
        uses: samhclark/cosign-exec-action@f8a4f58b424b15fa5fee1795fd25e6de48f9609d # v1.1.0
        with:
          args: >-
            verify --key .github/keys/fedora-ostree-desktops.pub
            quay.io/fedora-ostree-desktops/silverblue:{}
          each: ${{ inputs.tags }}

      - name: Log in to Container Registry for build cache
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${REGISTRY_TOKEN}" | ./log-in-to-registry.sh "${{ github.actor }}" "${{ inputs.registry }}/${{ inputs.namespace }}"

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          buildah-image: quay.io/containers/buildah:v1.43.1@sha256:f48d0f1b10486488f711f9a63da12e8f228b320ce0aeb0f66bbea68fd2f9900b
          containerfiles: |
            ${{ inputs.containerfile_path }}
          image: ${{ inputs.image_name }}
          tags: ${{ inputs.tags }}
          layers: true
          squash: false
          extra-args: |
            --cache-from ${{ inputs.cache_ref }}

  build-sign-push-custom-silverblue:
    name: Build, sign, then push
    if: ${{ inputs.publish }}
    runs-on: ubuntu-26.04
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify base image signature
        uses: samhclark/cosign-exec-action@f8a4f58b424b15fa5fee1795fd25e6de48f9609d # v1.1.0
        with:
          args: >-
            verify --key .github/keys/fedora-ostree-desktops.pub
            quay.io/fedora-ostree-desktops/silverblue:{}
          each: ${{ inputs.tags }}

      - name: Log in to Container Registry for build cache
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${REGISTRY_TOKEN}" | ./log-in-to-registry.sh "${{ github.actor }}" "${{ inputs.registry }}/${{ inputs.namespace }}"

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          buildah-image: quay.io/containers/buildah:v1.43.1@sha256:f48d0f1b10486488f711f9a63da12e8f228b320ce0aeb0f66bbea68fd2f9900b
          containerfiles: |
            ${{ inputs.containerfile_path }}
          image: ${{ inputs.image_name }}
          tags: ${{ inputs.tags }}
          layers: true
          squash: false
          extra-args: |
            --cache-from ${{ inputs.cache_ref }}
            --cache-to ${{ inputs.cache_ref }}

      - name: Push to Container Registry
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ inputs.registry }}/${{ inputs.namespace }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.namespace }}/${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the published OCI image
        uses: samhclark/cosign-exec-action@f8a4f58b424b15fa5fee1795fd25e6de48f9609d # v1.1.0
        env:
          COSIGN_PASSWORD: ${{ secrets.cosign_password }}
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            sign --yes --key=env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false
            ${{ inputs.registry }}/${{ inputs.namespace }}/${{ inputs.image_name }}:{}@${{ steps.push.outputs.digest }}
          each: ${{ inputs.tags }}

      - name: Echo outputs for auditing
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"
