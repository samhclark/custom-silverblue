on:
  workflow_call:
    inputs:
      containerfile_path:
        required: true
        type: string
      registry:
        required: true
        type: string
      namespace:
        required: true
        type: string
      image_name:
        required: true
        type: string
      tags:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    secrets:
      cosign_password:
        required: false
      cosign_private_key:
        required: false


jobs:
  build-custom-silverblue:
    name: Build
    if: ${{ ! inputs.publish }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove fuse-overlayfs
        run: |
          while p=$(command -v fuse-overlayfs 2>/dev/null); do sudo rm -f "$p"; done

      - name: Verify base image signature
        uses: samhclark/cosign-exec-action@fd4c037a25705e60a8ba5cf337e48e2088479dd8 # v1.1.1
        with:
          args: >-
            verify --key .github/keys/fedora-ostree-desktops.pub
            quay.io/fedora-ostree-desktops/silverblue:{}
          each: ${{ inputs.tags }}

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          containerfiles: |
            ${{ inputs.containerfile_path }}
          image: ${{ inputs.image_name }}
          tags: ${{ inputs.tags }}
          layers: true
          squash: false

  build-sign-push-custom-silverblue:
    name: Build, push, sign, and verify
    if: ${{ inputs.publish && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove fuse-overlayfs
        run: |
          while p=$(command -v fuse-overlayfs 2>/dev/null); do sudo rm -f "$p"; done

      - name: Verify base image signature
        uses: samhclark/cosign-exec-action@fd4c037a25705e60a8ba5cf337e48e2088479dd8 # v1.1.1
        with:
          args: >-
            verify --key .github/keys/fedora-ostree-desktops.pub
            quay.io/fedora-ostree-desktops/silverblue:{}
          each: ${{ inputs.tags }}

      - name: Log in to Container Registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${REGISTRY_TOKEN}" | ./log-in-to-registry.sh "${{ github.actor }}" "${{ inputs.registry }}/${{ inputs.namespace }}"

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          containerfiles: |
            ${{ inputs.containerfile_path }}
          image: ${{ inputs.image_name }}
          tags: ${{ inputs.tags }}
          layers: true
          squash: false

      - name: Push to Container Registry
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ inputs.registry }}/${{ inputs.namespace }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.namespace }}/${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the published OCI image
        uses: samhclark/cosign-exec-action@fd4c037a25705e60a8ba5cf337e48e2088479dd8 # v1.1.1
        env:
          COSIGN_PASSWORD: ${{ secrets.cosign_password }}
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            sign --yes --key=env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false
            ${{ inputs.registry }}/${{ inputs.namespace }}/${{ inputs.image_name }}:{}@${{ steps.push.outputs.digest }}
          each: ${{ inputs.tags }}

      - name: Verify the published OCI image signature
        uses: samhclark/cosign-exec-action@fd4c037a25705e60a8ba5cf337e48e2088479dd8 # v1.1.1
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            verify --key overlay-root/etc/pki/cosign/cosign.pub --new-bundle-format=false
            ${{ inputs.registry }}/${{ inputs.namespace }}/${{ inputs.image_name }}@${{ steps.push.outputs.digest }}

      - name: Echo outputs for auditing
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"
