name: Release bootc image

on:
  workflow_dispatch:

permissions:
  contents: read

# Let a release finish signing before another release can update the same tag.
concurrency:
  group: release-custom-silverblue
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.17"

jobs:
  lint:
    name: Lint and test Python
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"

      - name: Check
        run: make check

      - name: Test
        run: make test

  publish-custom-silverblue:
    name: Build, sign, and publish image
    needs: lint
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-build.yaml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      containerfile_path: ./Containerfile
      registry: ghcr.io
      namespace: samhclark
      image_name: custom-silverblue
      tags: |
        44
      publish: true
    secrets:
      cosign_password: ${{ secrets.COSIGN_PASSWORD }}
      cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
